// A provider card's sections, in the order shown, each on or off; set in Settings.
const PV_SECTIONS_KEY = 'planner_sections';
const PV_SECTION_NAMES = {accounts: 'Accounts', chart: 'Planned use chart', steps: 'Next steps'};
const PV_SECTIONS_DEFAULT = [['accounts', true], ['chart', true], ['steps', true]];
// The page's own blocks, the same way: the provider cards, the combined chart, the modes table.
const PV_PAGE_SECTIONS_KEY = 'planner_page_sections';
const PV_PAGE_SECTION_NAMES = {cards: 'Provider cards', all: 'All accounts chart', modes: 'Modes compared'};
const PV_PAGE_SECTIONS_DEFAULT = [['cards', true], ['all', true], ['modes', true]];
// Each chart's "Soonest first" switch: its account rows in the Accounts list's order, not the CLI's.
const PV_SORT_KEY = 'planner_sort';
// Each provider's chart opens on 7 days and the combined one on 30.
const PV = {root: null, io: null, sections: PV_SECTIONS_DEFAULT.map(x => [...x]), pageSections: PV_PAGE_SECTIONS_DEFAULT.map(x => [...x]), sorts: {claude: false, codex: false, opencode: false, all: false}, docs: {}, tips: [], ranges: {claude: 168, codex: 168, opencode: 168, all: 720}, pages: {claude: 0, codex: 0, opencode: 0, all: 0}, more: {}};
// The providers, in card order. OpenCode is optional: a relay without its CLI shows no card for it.
const PV_PROVIDERS = ['claude', 'codex', 'opencode'];
const PV_OPTIONAL = ['opencode'];
// The plan is simulated this far ahead; ‹ › page a chart through it, one range at a time.
const PV_PLAN_H = 720;
const PV_RANGES = {24: '24 hours', 72: '3 days', 168: '7 days', 720: '30 days'};
// U+2691 with the text-presentation selector, so it takes the mark's colour instead of an emoji's.
const PV_FLAG = '\u2691\uFE0E';
const PV_STAR = '\u2605\uFE0E';
const PV_RESET = '\u27F2';
const PV_STORE = {claude: 'planner_claude', codex: 'planner_codex', opencode: 'planner_opencode'};
// The settings: input id -> [storage key, default, check].
const PV_SETTINGS = {
  weekPerFive: ['planner_week_per_five', WEEK_PER_FIVE, v => v > 0 && v <= 100],
  fillH: ['planner_fill_h', 5, v => v >= 1 && v <= 5],
  warnH: ['planner_warn_h', 24, v => v >= 0],
};
// The plan's two switches: checkbox id -> [storage key, default].
const PV_TOGGLES = {
  parallel: ['planner_parallel', true],
  rotate: ['planner_rotate', false],
  // Simple: only what to do now. The page hides the rest (body.simple .detail) but still plans it.
  simple: ['planner_simple', false],
};
// Hours of use, kept as one JSON document: {mode, from, to, jobs, jobsAt}.
const PV_HOURS_KEY = 'planner_hours';
const PV_HOURS_FIELDS = ['hoursFrom', 'hoursTo', 'jobs', 'jobsAt'];
const PV_CMD = {
  claude: {name: 'Claude', switch: n => `cswap switch ${n}`, burn: () => null},
  codex: {name: 'Codex', switch: n => `codex-auth switch ${n}`, burn: n => `codex-auth reset ${n}`},
  // One plan per key: nothing to switch to, no credits to burn.
  opencode: {name: 'OpenCode Go', switch: () => null, burn: () => null},
};
// One session as a share of the week: the provider's own when its document says, else Settings.
const pvS = doc => doc.weekPerFive ?? pvSetting('weekPerFive');

const pv$ = id => PV.root.querySelector('#' + id);
// On screen: planner.html always, the phone's tab only while it is open.
const pvShown = () => !!PV.root && PV.root.getClientRects().length > 0;

function pvEsc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
}
function pvGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function pvSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked: this visit only */ } }

const pvTime = t => new Date(t).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
const pvDay = t => new Date(t).toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
// Today: the time. This week: the weekday and time. Further out: the date and time.
function pvWhen(t, now) {
  if (new Date(t).toDateString() === new Date(now).toDateString()) return pvTime(t);
  if (t - now < 6 * 24 * PLAN_H) return `${new Date(t).toLocaleDateString([], {weekday: 'short'})} ${pvTime(t)}`;
  return `${pvDay(t)} ${pvTime(t)}`;
}
function pvIn(t, now) {
  const m = Math.round((t - now) / 60e3);
  if (m < 0) return 'past';
  if (m < 60) return `${m}m`;
  const h = Math.floor(m / 60);
  return h < 48 ? `${h}h ${m % 60}m` : `${Math.floor(h / 24)}d ${h % 24}h`;
}
const pvHours = h => (h >= 10 ? Math.round(h) : Math.round(h * 10) / 10) + 'h';
const pvSessions = n => {
  const v = Math.abs(n) >= 10 ? Math.round(n) : Math.round(n * 10) / 10;
  return `${v} session${v === 1 ? '' : 's'}`;
};

function pvAccept(text) {
  const doc = plannerParse(text);
  PV.docs[doc.provider] = doc;
  pvSet(PV_STORE[doc.provider], typeof text === 'string' ? text : JSON.stringify(text));
  return doc.provider;
}

function pvColor(i) { return `var(--a${i % 6})`; }

// The bubble behind every mark and bar: hover shows it, a click pins it. Each render files its
// tips here and the elements carry an index, so the markup holds no copy of the text.
function pvTip(tip) {
  PV.tips.push(tip);
  return `data-tip="${PV.tips.length - 1}" aria-label="${pvEsc(tip.head)}"`;
}
function pvTipHtml(tip) {
  return `<b>${pvEsc(tip.head)}</b><dl>${tip.rows.filter(r => r[1] != null && r[1] !== '')
    .map(([k, v]) => `<dt>${pvEsc(k)}</dt><dd>${pvEsc(v)}</dd>`).join('')}</dl>`;
}
function pvShowTip(el, pin) {
  const box = pv$('tip');
  const tip = PV.tips[Number(el.dataset.tip)];
  if (!tip) return;
  // A pinned tip stays until a click elsewhere or Escape: hover and focus do not replace it.
  if (!pin && box.dataset.pinned && !box.hidden) return;
  box.innerHTML = pvTipHtml(tip);
  box.hidden = false;
  box.dataset.pinned = pin ? '1' : '';
  PV.pinned = pin ? {i: el.dataset.tip, head: tip.head} : null;
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  const left = Math.max(8, Math.min(innerWidth - b.width - 8, r.left + r.width / 2 - b.width / 2));
  const top = r.top - b.height - 8 >= 8 ? r.top - b.height - 8 : r.bottom + 8;
  box.style.left = `${left}px`;
  box.style.top = `${top}px`;
}
function pvHideTip(force) {
  const box = pv$('tip');
  if (force || !box.dataset.pinned) { box.hidden = true; box.dataset.pinned = ''; }
}
const pvAt = (t, now) => `${pvDay(t)} ${pvTime(t)} (${t >= now ? 'in ' + pvIn(t, now) : 'past'})`;
const pvLen = (a, b) => `${pvHours((b - a) / PLAN_H)} · ${pvSessions((b - a) / PLAN_H / pvSetting('fillH'))}`;
const pvOrdinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1: 'st', 2: 'nd', 3: 'rd'}[n % 10] || 'th'));

// One timeline: rows of segments and marks over [start, end). `ticks` are {t, label, cls}.
function pvTimeline(start, end, rows, ticks, now) {
  const at = t => Math.max(0, Math.min(100, (t - start) / (end - start) * 100));
  const grid = ticks.map(k => k.cls === 'we'
    ? `<i class="we" style="left:${at(k.t)}%;width:${at(k.end) - at(k.t)}%"></i>`
    : `<i style="left:${at(k.t)}%"></i>`).join('')
    + (now >= start && now < end ? `<i class="now" style="left:${at(now)}%"></i>` : '');
  const axis = ticks.filter(k => k.label).map(k => `<span${k.major ? ' class="major"' : ''} style="left:${at(k.t)}%">${pvEsc(k.label)}</span>`).join('');
  const body = rows.map((r, i) => {
    const items = r.items.filter(x => x.t != null ? x.t >= start && x.t < end : x.end > start && x.start < end).map(x => x.t != null
      ? `<span class="mark ${x.cls}" style="left:${at(x.t)}%" tabindex="-1" role="img" ${pvTip(x.tip)}>${x.glyph}</span>`
      : `<span class="seg ${x.cls || ''}" tabindex="-1" role="img" style="left:${at(x.start)}%;width:${at(x.end) - at(x.start)}%;${x.color ? `background-color:${x.color};--session:${pvSetting('fillH') * PLAN_H / (Math.min(x.end, end) - Math.max(x.start, start)) * 100}%` : ''}" ${pvTip(x.tip)}></span>`).join('');
    const row = `<div class="tl-row ${r.head ? 'head' : ''} ${r.sub ? 'sub' : ''}${r.live ? ' now' : ''}"><span class="name" title="${pvEsc(r.title || r.label)}${r.live ? ' · live' : ''}">${pvEsc(r.label)}${r.pct == null ? '' : ` <span class="pct">(${pvPct(r.pct)}${r.days == null ? '' : ` ${r.days.toFixed(1)}d`})</span>`}</span><div class="lane ${r.thin ? 'thin' : ''}">${items}</div></div>`;
    // A provider's main line and its parallel lines share one box, apart from its accounts.
    const next = rows[i + 1];
    return (r.head ? `<div class="tl-group ${r.group || ''}">` : '') + row + ((r.head || r.sub) && !(next && next.sub) ? '</div>' : '');
  }).join('');
  // The chart fits its card at every range: no sideways scroll, the bars narrow instead.
  return `<div class="tl-wrap" role="region" aria-label="Usage timeline"><div class="tl${end - start > 8 * 24 * PLAN_H ? ' dense' : ''}"><div class="grid">${grid}</div><div class="axis">${axis}</div>${body}</div></div>`;
}

function pvChart(key, rows, now) {
  const hours = PV.ranges[key], page = PV.pages[key];
  const start = now + page * hours * PLAN_H, end = Math.min(start + hours * PLAN_H, now + PV_PLAN_H * PLAN_H);
  const last = (page + 1) * hours >= PV_PLAN_H;
  const options = Object.entries(PV_RANGES).map(([h, label]) =>
    `<option value="${h}"${Number(h) === hours ? ' selected' : ''}>${label}</option>`).join('');
  return `<div class="chart-head"><h2>${key === 'all' ? 'All accounts' : 'Planned use'}</h2>`
    + `<span class="nav"><button data-nav="${key}" data-dir="-1" aria-label="Earlier"${page ? '' : ' disabled'}>‹</button>`
    + `<span class="span small muted">${pvStamp(start)} – ${pvStamp(end)}</span>`
    + `<button data-nav="${key}" data-dir="1" aria-label="Later"${last ? ' disabled' : ''}>›</button></span>`
    + `<label>Range <select data-range="${key}">${options}</select></label>`
    + `<label class="switch" title="Order accounts by their next reset or credit expiry, as in the Accounts list"><input type="checkbox" role="switch" data-sort="${key}"${PV.sorts[key] ? ' checked' : ''}>Soonest first</label></div>`
    + `<div class="legend"><span>bar: planned use · dividers: sessions</span><span class="gap-key">▨ gap</span>${rows.some(r => r.items.some(i => i.cls === 'off')) ? '<span>blank: off hours</span>' : ''}<span class="reset-key">${PV_RESET} 7d reset</span><span class="credit-key">${PV_FLAG} credit expires</span><span class="burn-key">${PV_STAR} burn reset</span>${rows.some(r => r.items.some(i => i.cls === 'bonus')) ? '<span class="burn-key"><span class="bonus-key">▬</span> parallel bonus</span>' : ''}</div>`
    + pvTimeline(start, end, rows, hours === 24 ? pvDayTicks(start, end) : pvMonthTicks(start, end), now);
}

// A range end in one fixed shape, "Wed 11/07", so the nav label keeps its width as it pages.
function pvStamp(t) {
  const d = new Date(t);
  const p2 = n => String(n).padStart(2, '0');
  return `${d.toLocaleDateString('en-US', {weekday: 'short'})} ${p2(d.getMonth() + 1)}/${p2(d.getDate())}`;
}

function pvDayTicks(start, end) {
  const ticks = [];
  const d = new Date(start); d.setMinutes(0, 0, 0);
  for (let t = d.getTime() + PLAN_H; t < end; t += PLAN_H) {
    const h = new Date(t).getHours();
    ticks.push({t, label: h % 3 === 0 ? (h === 0 ? pvDay(t).replace(/,.*/, '') + ' 0:00' : `${h}:00`) : ''});
  }
  return ticks;
}

function pvMonthTicks(start, end) {
  const ticks = [];
  const d = new Date(start); d.setHours(0, 0, 0, 0);
  for (let t = d.getTime(); t < end; ) {
    const day = new Date(t);
    const next = new Date(day); next.setDate(day.getDate() + 1);
    // Major days keep their label when a narrow chart has no room for every day; the 30th would
    // collide with the next month's 1st.
    const date = day.getDate();
    if (t > start) ticks.push({t, major: date === 1 || (date % 5 === 0 && date <= 25), label: day.getDate() === 1 || ticks.length === 0
      ? day.toLocaleDateString([], {month: 'short', day: 'numeric'}) : String(day.getDate())});
    if (day.getDay() === 0 || day.getDay() === 6) ticks.push({t, end: next.getTime(), cls: 'we'});
    t = next.getTime();
  }
  return ticks;
}

// Each account's next event: whichever of its windows or credits comes first.
function pvNextEvent(a, now) {
  const ts = [a.week && a.week.resetsAt, a.five && a.five.pct > 0 && a.five.resetsAt,
              ...a.credits.map(c => c.expiresAt)].filter(t => t && t > now);
  return ts.length ? Math.min(...ts) : Infinity;
}

function pvMeter(label, w, now) {
  if (!w) return `<div class="meter"><div class="lbl">${label} <span>no limit</span></div></div>`;
  const cls = w.pct >= 90 ? 'hi' : w.pct >= 60 ? 'mid' : '';
  const reset = w.resetsAt && w.resetsAt > now
    ? `⟲ ${pvWhen(w.resetsAt, now)} · ${pvIn(w.resetsAt, now)}` : (w.pct ? '' : 'not started');
  return `<div class="meter"><div class="lbl"><span>${label} <b>${pvPct(w.pct)}</b></span><span>${reset}</span></div>`
    + `<div class="bar"><i class="${cls}" style="width:${Math.min(100, w.pct)}%"></i></div></div>`;
}

function pvAccounts(doc, plan, room, now, colors) {
  const sorted = [...doc.accounts].sort((a, b) => pvNextEvent(a, now) - pvNextEvent(b, now));
  return sorted.map(a => {
    const lost = plan.resets.find(r => r.id === a.id);
    // Rows under the cards, one per reset credit: what the plan does with it under 5h, when it
    // expires under 7d. Then what the week leaves unused when it resets.
    const row = (l, r) => `<span>${l}</span><span>${r}</span>`;
    const rows = a.credits.map(c => {
      const burned = plan.burns.find(b => b.credit && b.credit.id === c.id && b.id === a.id);
      const lapsed = plan.expired.find(x => x.credit && x.credit.id === c.id && x.id === a.id);
      return row(burned ? `<span class="burn-key">${PV_STAR}</span> burn ${pvWhen(burned.t, now)}`
          : lapsed ? '<span class="lost">lapses unused</span>' : 'not needed in 30d',
        `<span class="credit-key">${PV_FLAG}</span> ${c.expiresAt == null ? 'no expiry given' : `expires ${pvDay(c.expiresAt)}`}`);
    }).join('') + (lost && lost.lostPct >= 1
      ? row(`<span class="lost">${Math.round(lost.lostPct)}% unused</span>`, `<span class="reset-key">${PV_RESET}</span> week resets ${pvWhen(lost.t, now)}`) : '');
    const r = room.accounts.find(x => x.id === a.id);
    const left = r ? `<span class="left" title="Weekly allowance left on this account until its weekly reset ${pvWhen(r.deadline, now)}, at ${pvSetting('fillH')}h per session">${pvSessions(r.left)} left this week</span>` : '';
    const extra = !r ? ''
      : r.room < 0 ? `<span class="lost">${pvSessions(-r.room)} unused by ${pvWhen(r.deadline, now)}</span>${left}`
      : `<span class="${r.room < pvWarnSessions() ? 'thin' : ''}">room ${pvSessions(r.room)}</span>${left}${a.credits.length ? '' : '<span>no resets</span>'}`;
    return `<div class="acct ${a.ok ? '' : 'off'}">`
      + `<div class="who"><b><span class="dot" style="background:${colors[a.id]}"></span>${pvEsc(a.name)}${a.active ? '<span class="live">live</span>' : ''}</b>`
      + `<span class="email" title="${pvEsc(a.email)}">${pvEsc(a.email)}</span>`
      + `<span class="extra">${a.ok ? extra : 'no usage data'}</span></div>`
      + '<div class="use">' + pvMeter('5h', a.five, now) + pvMeter('7d', a.week, now) + (a.month ? pvMeter('month', a.month, now) : '')
      + (rows ? `<div class="credits">${rows}</div>` : '') + '</div></div>';
  }).join('');
}

function pvLanes(doc, plan, colors, now, soonest = false) {
  const name = id => (doc.accounts.find(a => a.id === id) || {}).name || `#${id}`;
  // Each bubble names the account in full: its number, its alias when it has one, and its email.
  const acct = id => {
    const a = doc.accounts.find(x => x.id === id) || {};
    return ['Account', [`#${id}`, a.name && a.name !== `#${id}` ? a.name : '', a.email].filter(Boolean).join(' · ')];
  };
  const cmd = PV_CMD[doc.provider];
  const useTip = g => ({head: `${name(g.id)} · planned use`, rows: [acct(g.id), ['From', pvAt(g.start, now)], ['To', pvAt(g.end, now)],
    ['Length', pvLen(g.start, g.end)], ['Switch with', cmd.switch(g.id)]]});
  const gapTip = g => ({head: 'Gap · nothing usable', rows: [['From', pvAt(g.start, now)], ['To', pvAt(g.end, now)],
    ['Length', pvHours((g.end - g.start) / PLAN_H)]]});
  const offTip = g => ({head: 'Off · outside hours of use', rows: [['From', pvAt(g.start, now)], ['To', pvAt(g.end, now)],
    ['Hours of use', pvHoursText()]]});
  const bonusTip = g => ({head: `${name(g.id)} · parallel bonus`, rows: [acct(g.id), ['Lane', `${pvOrdinal(g.lane + 1)} line, beside the main one`],
    ['From', pvAt(g.start, now)], ['To', pvAt(g.end, now)], ['Length', pvLen(g.start, g.end)],
    ['Why', 'a reset credit refilled this account while another is in use']]});
  const head = {label: cmd.name, head: true, group: `prov-${doc.provider}`, thin: true, items: plan.segments
    .map(g => ({start: g.start, end: g.end, cls: g.off ? 'off' : g.id == null ? 'idle' : '', color: g.id == null ? '' : colors[g.id],
                tip: g.off ? offTip(g) : g.id == null ? gapTip(g) : useTip(g)}))};
  // Bonus use running alongside the main line, on one thin unlabelled row: a third line in
  // parallel overlaps the second there, its own account's row tells them apart.
  const lanes = plan.parallel && plan.parallel.length ? [{label: '', sub: true, thin: true, title: 'In parallel',
    items: plan.parallel.map(g => ({start: g.start, end: g.end, cls: 'bonus', color: 'var(--bonus)', tip: bonusTip(g)}))}] : [];
  // Each account's row names its weekly use now and the days left in its week: #1 (66% 5.1d),
  // and a dot marks the account in use now.
  // Soonest first sorts only the account rows; the main and parallel lines stay on top. The sort is
  // stable, so ties keep the CLI's order.
  const accounts = soonest ? [...doc.accounts].sort((a, b) => pvNextEvent(a, now) - pvNextEvent(b, now)) : doc.accounts;
  const rows = accounts.map(a => ({label: a.name, title: a.email, live: !!a.active, pct: a.week ? a.week.pct : null,
    days: a.week && a.week.resetsAt > now ? (a.week.resetsAt - now) / (24 * PLAN_H) : null, items: [
    ...plan.segments.filter(g => g.id === a.id).map(g => ({start: g.start, end: g.end, color: colors[a.id], tip: useTip(g)})),
    ...(plan.parallel || []).filter(g => g.id === a.id).map(g => ({start: g.start, end: g.end, cls: 'bonus', color: 'var(--bonus)', tip: bonusTip(g)})),
    // Flags: red where the 7d window resets, yellow where a reset credit expires, green where one is burned.
    ...plan.resets.filter(r => r.id === a.id).map(r => ({t: r.t, glyph: PV_RESET, cls: 'reset', tip: {
      head: `${a.name} · 7d window resets`, rows: [acct(a.id), ['When', pvAt(r.t, now)],
        ['Unused then', r.lostPct >= 1 ? `${Math.round(r.lostPct)}% of the week · ${pvSessions(r.lostPct / pvS(doc))}` : 'none']]}})),
    ...a.credits.filter(c => c.expiresAt != null).map(c => {
      const burned = plan.burns.find(b => b.credit && b.credit.id === c.id && b.id === a.id);
      const lapsed = plan.expired.find(x => x.credit && x.credit.id === c.id && x.id === a.id);
      return {t: c.expiresAt, glyph: PV_FLAG, cls: 'credit', tip: {head: `${a.name} · reset credit expires`, rows: [acct(a.id),
        ['When', pvAt(c.expiresAt, now)], ['Credit', c.label],
        ['Plan', burned ? `burn it ${pvWhen(burned.t, now)}` : lapsed ? 'lapses unused: spare' : 'not needed in the next 30 days']]}};
    }),
    ...plan.burns.filter(b => b.id === a.id).map(b => ({t: b.t, glyph: PV_STAR, cls: 'burn', tip: {
      head: `${a.name} · burn a reset credit`, rows: [acct(a.id), ['When', pvAt(b.t, now)],
        ['Gives back', `${pvHours(b.gainH)} · +${pvSessions(b.gainH / pvSetting('fillH'))}`],
        ['Why', b.why === 'full' ? 'its week is used up, with time to use all of it again: run it in parallel'
          : b.why === 'gap' ? 'nothing else is usable: it fills the gap' : 'the credit expires next: use what it can still give'],
        ['How', cmd.burn(a.id) || 'reset it in the Claude app']]}})),
  ]}));
  return [head, ...lanes, ...rows];
}

function pvSteps(doc, plan, now) {
  const cmd = PV_CMD[doc.provider];
  const name = id => (doc.accounts.find(a => a.id === id) || {}).name || `#${id}`;
  const active = (doc.accounts.find(a => a.active) || {}).id;
  const steps = plannerSteps(plan, PV.ranges[doc.provider]);
  let on = active;  // the account last in use, so a run after a gap or off hours reads as resuming
  const items = steps.map((s, i) => {
    const t = i === 0 && s.t <= now + 15 * 60e3 ? 'now' : pvWhen(s.t, now);
    let text, command = null;
    if (s.kind === 'idle') text = `nothing usable until ${pvWhen(s.until, now)}`;
    else if (s.kind === 'off') text = `off: outside hours of use until ${pvWhen(s.until, now)}`;
    else if (s.kind === 'parallel') text = `<span class="bonus-key">▬</span> also run <b>${pvEsc(name(s.id))}</b> in parallel until ${pvWhen(s.until, now)}`;
    else if (s.kind === 'burn') {
      text = `burn a reset on <b>${pvEsc(name(s.id))}</b>: +${pvSessions(s.gainH / pvSetting('fillH'))}${s.why === 'expiring' ? ', before it expires' : s.why === 'full' ? ', in full' : ''}`;
      command = cmd.burn(s.id);
      if (!command) text += ' <span class="muted">(reset it in the Claude app)</span>';
    } else {
      const stay = s.id === on;
      text = `${stay ? (i === 0 ? 'stay on' : 'resume') : 'switch to'} <b>${pvEsc(name(s.id))}</b> until ${pvWhen(s.until, now)}`;
      if (!stay) command = cmd.switch(s.id);
      on = s.id;
    }
    // A switch can be run through the relay, armed: the first press arms, the second runs.
    const run = command && s.kind === 'use' && pvCanRun()
      ? `<button class="run" data-run="${pvEsc(doc.provider + ':' + s.id)}" data-arm-key="${pvEsc('run:' + doc.provider + ':' + s.id)}" title="Press twice to run on the relay's machine">▶ ${pvEsc(command)}</button>` : '';
    const copy = command ? `<button data-copy="${pvEsc(command)}" title="Copy ${pvEsc(command)}">${run ? 'copy' : pvEsc(command)}</button>` : '';
    return `<li class="${s.kind}"><time>${pvEsc(t)}</time><span>${text}</span><span class="cmds">${run}${copy}</span></li>`;
  });
  // The next two steps, and the rest behind a button: the list is the plan, the top is what to do.
  const open = PV.more[doc.provider], hidden = items.length - 2;
  const more = hidden > 0 ? `<li class="more"><button data-more="${doc.provider}" aria-expanded="${!!open}">${open ? 'Show fewer' : `Show ${hidden} more`}</button></li>` : '';
  return '<ol class="steps">' + (open ? items : items.slice(0, 2)).join('') + more + '</ol>';
}

// Every combination of the two switches, planned on the same data and settings, side by side.
const PV_MODES = [[false, false, 'Sequential'], [false, true, 'Take turns'], [true, false, 'Parallel'], [true, true, 'Parallel + turns']];
function pvModes(docs, now) {
  const f = (n, d = 0) => n.toFixed(d);
  const body = docs.map(d => {
    const base = {weekPerFive: pvS(d), fillH: pvSetting('fillH'), windows: pvWindows()};
    const rows = PV_MODES.map(([parallel, rotate, label]) => ({label, parallel, rotate,
      s: plannerSummary(plannerSimulate(d.accounts, now, {...base, parallel, rotate}), base)}));
    const best = Math.max(...rows.map(r => r.s.sessions));
    return rows.map(({label, parallel, rotate, s}, i) => {
      const on = parallel === pvToggle('parallel') && rotate === pvToggle('rotate');
      return `<tr class="${on ? 'on' : ''}">${i ? '' : `<th scope="rowgroup" rowspan="${rows.length}" class="prov-${d.provider}"><span class="dot"></span>${PV_CMD[d.provider].name}</th>`}`
        + `<th scope="row">${label}${on ? ' <span class="live">now</span>' : ''}</th>`
        + `<td class="${s.sessions >= best - 0.05 ? 'best' : ''}">${f(s.sessions, 1)}</td><td>${s.bonusSessions ? '+' + f(s.bonusSessions, 1) : '–'}</td>`
        + `<td>${f(s.gapH)}h</td><td>${s.burns}</td><td class="${s.lapsed ? 'bad' : ''}">${s.lapsed}</td>`
        + `<td class="${s.lostSessions >= 0.5 ? 'bad' : ''}">${f(s.lostSessions, 1)}</td><td>${s.switches}</td></tr>`;
    }).join('');
  }).join('');
  return `<section class="card modes detail"><h2>Modes compared · next 30 days</h2>
    <div class="table-wrap"><table><thead><tr><th></th><th scope="col">Mode</th><th scope="col">Sessions</th><th scope="col">of which parallel</th>
    <th scope="col">Main-line gap</th><th scope="col">Credits burned</th><th scope="col">Credits lapsed</th><th scope="col">Unused at 7d resets</th><th scope="col">Switches</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <div class="small muted">Recomputed from the same data and settings as the plans above. Parallel sessions count only if you run two agents at once.</div></section>`;
}

function pvChips(doc, plan, room, now) {
  const dayEnd = now + 24 * PLAN_H;
  const dayGap = plan.segments.filter(g => g.id == null && !g.off && g.start < dayEnd)
    .reduce((h, g) => h + (Math.min(g.end, dayEnd) - g.start) / PLAN_H, 0);
  const spare = plan.expired.length;
  const S = pvS(doc);
  const lost = plan.resets.reduce((n, r) => n + r.lostPct, 0) / S;
  const n = doc.accounts.filter(a => a.ok).length;
  const roomTitle = `Sessions you can skip before weekly allowance goes unused, at ${pvSetting('fillH')}h per session, one account at a time.`;
  const roomChip = room.room === Infinity ? ''
    : room.room < 0 ? `<span class="chip bad" title="${roomTitle}">${pvSessions(-room.room)} will go unused</span>`
    : room.room < pvWarnSessions() ? `<span class="chip warn" title="${roomTitle}">thin: ${pvSessions(room.room)} of room</span>`
    : `<span class="chip good" title="${roomTitle}">room: ${pvSessions(room.room)}</span>`;
  const chips = [
    `<span class="chip detail">${n} accounts · ${pvSessions(n * 100 / S)}/week</span>`,
    dayGap ? `<span class="chip bad">${pvHours(dayGap)} gap in 24h</span>` : '<span class="chip good">covered 24h</span>',
    plan.idleH ? `<span class="chip bad detail">${pvHours(plan.idleH)} gap in 30d</span>` : '<span class="chip good detail">covered 30d</span>',
    roomChip,
    room.accounts.length ? `<span class="chip" title="Weekly allowance left across accounts, each until its own weekly reset, at ${pvSetting('fillH')}h per session">${pvSessions(room.accounts.reduce((n, r) => n + r.left, 0))} left this week</span>` : '',
  ];
  // Reset credits and reset waste on a line of their own, under coverage and room.
  const resets = [
    plan.burns.length ? `<span class="chip"><span class="burn-key">${PV_STAR}</span> ${plan.burns.length} reset${plan.burns.length > 1 ? 's' : ''} to burn</span>` : '',
    plan.bonusH ? `<span class="chip bonus detail" title="Reset credits spent for their full value, used alongside the main line">+${pvSessions(plan.bonusH / pvSetting('fillH'))} in parallel, 30d</span>` : '',
    spare ? `<span class="chip warn detail" title="Credits that lapse unused even running all day: spare capacity, free for any work"><span class="credit-key">${PV_FLAG}</span> ${spare} spare reset${spare > 1 ? 's' : ''}</span>` : '',
    lost >= 0.1 ? `<span class="chip warn detail" title="Weekly headroom left at resets: spare capacity, free for any work">${pvSessions(lost)} unused at resets</span>` : '',
  ];
  const second = resets.join('');
  return `<div class="chips">${chips.join('')}</div>` + (second ? `<div class="chips resets">${second}</div>` : '');
}

function pvSetting(id) {
  const [, fallback, ok] = PV_SETTINGS[id];
  const v = parseFloat(pv$(id).value);
  return Number.isFinite(v) && ok(v) ? v : fallback;
}
// The hours of use set in Settings, all day when the page has no such fields (the vm tests).
function pvHoursSpec() {
  const box = pv$('hoursWindow');
  if (!box || !box.checked) return {mode: 'all'};
  const v = id => pv$(id).value;
  return {mode: 'window', from: v('hoursFrom'), to: v('hoursTo'), jobs: Math.min(4, Math.max(0, Number(v('jobs')) || 0)), jobsAt: v('jobsAt')};
}
const pvWindows = () => plannerHoursOfUse(pvHoursSpec(), pvSetting('fillH'));
function pvHoursText(spec = pvHoursSpec()) {
  if (spec.mode !== 'window') return 'all day';
  return `${spec.from}–${spec.to}${spec.jobs ? ` + ${spec.jobs} job${spec.jobs > 1 ? 's' : ''} ${spec.jobsAt}` : ''}`;
}
function pvToggle(id) { const box = pv$(id); return box ? box.checked : PV_TOGGLES[id][1]; }
// Claude counts a window's use and Codex what is left of it; this page always shows use.
const pvPct = used => `${Math.round(used)}%`;
// The amber line, in sessions: the hours of room asked for, at the fill time.
const pvWarnSessions = () => pvSetting('warnH') / pvSetting('fillH');

function pvRender() {
  const out = pv$('out');
  const scrolls = [...out.querySelectorAll('.tl-wrap, .steps')].map(el => [el.scrollLeft, el.scrollTop]);
  // A focused Range or Soonest first control keeps focus across the redraw.
  const ctl = out.contains(document.activeElement) ? document.activeElement.dataset : {};
  const focusedCtl = ctl.range ? `[data-range="${ctl.range}"]` : ctl.sort ? `[data-sort="${ctl.sort}"]` : null;
  const now = Date.now();
  PV.root.classList.toggle('simple', pvToggle('simple'));
  // A pinned tip outlives the redraw while the bar it names is drawn again in the same place.
  const tipBox = pv$('tip');
  const pinned = !tipBox.hidden && tipBox.dataset.pinned ? PV.pinned : null;
  const focusedTip = out.contains(document.activeElement) && document.activeElement.dataset.tip != null
    ? {i: document.activeElement.dataset.tip, head: document.activeElement.getAttribute('aria-label')} : null;
  pvHideTip(true);
  PV.tips = [];
  const docs = PV_PROVIDERS.map(p => PV.docs[p]).filter(Boolean);
  pv$('sources').innerHTML = docs.map(d => {
    const age = d.fetchedAt ? now - d.fetchedAt : null;
    const stale = age != null && age > 60 * 60e3;
    return `<span class="src ${stale ? 'stale' : ''}" title="usage read ${d.fetchedAt ? new Date(d.fetchedAt).toLocaleString() : 'at an unknown time'}">${PV_CMD[d.provider].name} · ${d.fetchedAt ? pvIn(now, d.fetchedAt) + ' old' : 'age unknown'}</span>`;
  }).join('');
  pv$('intake').hidden = !!(PV.docs.claude && PV.docs.codex) && !PV.showIntake;
  if (!docs.length) { out.innerHTML = '<div class="empty card">No data yet. Paste or drop the JSON above.</div>'; return; }

  const plans = docs.map(d => {
    const colors = {};
    d.accounts.forEach((a, i) => { colors[a.id] = pvColor(i); });
    const opts = {weekPerFive: pvS(d), fillH: pvSetting('fillH'), windows: pvWindows(),
                  parallel: pvToggle('parallel'), rotate: pvToggle('rotate')};
    return {doc: d, colors, plan: plannerSimulate(d.accounts, now, opts), room: plannerRoom(d.accounts, now, opts)};
  });
  const cards = () => plans.map(({doc, colors, plan, room}) => {
    const parts = {
      accounts: () => `<h2>Accounts · soonest first</h2>${pvAccounts(doc, plan, room, now, colors)}`,
      chart: () => pvChart(doc.provider, pvLanes(doc, plan, colors, now, PV.sorts[doc.provider]), now),
      steps: () => pvSteps(doc, plan, now),
    };
    return `
    <section class="card prov-${doc.provider}">
      <h3><span class="dot"></span>${PV_CMD[doc.provider].name}</h3>
      ${pvChips(doc, plan, room, now)}
      ${PV.sections.filter(([, on]) => on).map(([id]) => `<div class="sec sec-${id}">${parts[id]()}</div>`).join('')}
    </section>`;
  }).join('');
  // The page's blocks in the order set in Settings, hidden ones not drawn; the footer always last.
  const blocks = {
    cards: () => `<div class="providers">${cards()}</div>`,
    all: () => `
    <section class="card detail">
      ${pvChart('all', plans.flatMap(({doc, colors, plan}) => pvLanes(doc, plan, colors, now, PV.sorts.all)), now)}
    </section>`,
    modes: () => pvModes(docs, now),
  };
  out.innerHTML = `${PV.pageSections.filter(([, on]) => on).map(([id]) => blocks[id]()).join('')}
    <div class="small muted detail">Plans assume one account on the main line at a time, ${pvHoursSpec().mode === 'window' ? `only in hours of use (${pvEsc(pvHoursText())})` : 'all 24 hours'}, one session per ${pvSetting('fillH')}h of use${pvToggle('parallel') ? ', and reset credits spent for full value run in parallel beside it' : ''}${pvToggle('rotate') ? '; accounts take turns a session at a time' : '; each account runs until its week is used up'}. A Claude reset keeps the week's end date; a Codex reset restarts the week.${PV.docs.opencode ? ` An OpenCode Go session is ${OPENCODE_WEEK_PER_FIVE}% of its week: the plan's 5h limit is a fifth of the month, its week half.` : ''} <a href="#" id="again">Load new data</a></div>`;
  out.querySelectorAll('.tl-wrap, .steps').forEach((el, i) => {
    if (scrolls[i]) [el.scrollLeft, el.scrollTop] = scrolls[i];
  });
  // Each chart is one Tab stop: its first bar or mark, and the arrow keys rove from there.
  out.querySelectorAll('.tl-wrap').forEach(w => { const first = w.querySelector('[data-tip]'); if (first) first.tabIndex = 0; });
  const again = pinned && out.querySelector(`[data-tip="${pinned.i}"]`);
  if (again && PV.tips[pinned.i].head === pinned.head) pvShowTip(again, true);
  // And a focused bar keeps focus, and its place in the chart's Tab order.
  const focus = focusedTip && out.querySelector(`[data-tip="${focusedTip.i}"]`);
  if (focus && focus.getAttribute('aria-label') === focusedTip.head) {
    focus.closest('.tl-wrap').querySelector('[data-tip][tabindex="0"]').tabIndex = -1;
    focus.tabIndex = 0;
    focus.focus({preventScroll: true});
  }
  if (focusedCtl) out.querySelector(focusedCtl)?.focus({preventScroll: true});
}

function pvLoad(text) {
  const err = pv$('err');
  try {
    const got = pvAccept(text);
    err.textContent = '';
    PV.showIntake = false;
    pvRender();
    return got;
  } catch (e) {
    err.textContent = `Could not read that: ${e.message}`;
    return null;
  }
}

// The relay runs `cswap list --json`, `codex-auth list --json` and `opencode-go-usage list --json`
// and hands back what they print.
// A page opened as a file, or from a relay without the route, says so and keeps to pasting.
// How the page reaches the relay. Served over HTTP, by /api/planner-*; the phone's tab sets its
// own, over the socket. Opened as a file, there is no relay to reach.
const PV_HTTP = {
  reachable: () => location.protocol.startsWith('http'),
  async usage() {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 65000);
    try {
      // location.search carries ?token= when the listener asks for one.
      const r = await fetch('/api/planner-usage' + location.search, {cache: 'no-store', signal: controller.signal});
      if (!r.ok) throw new Error(`the relay answered ${r.status}`);
      return await r.json();
    } finally {
      clearTimeout(timer);
    }
  },
  async run(provider, account) {
    const q = new URLSearchParams(location.search);
    q.set('provider', provider);
    q.set('account', account);
    const r = await fetch(`/api/planner-run?${q}`, {headers: {'X-Herdr-Planner': 'run'}, cache: 'no-store'});
    const a = await r.json().catch(() => ({}));
    return {ok: !!a.ok, error: a.error || `the relay answered ${r.status}`};
  },
};

async function pvFetch() {
  if (!PV.io.reachable()) return;
  const err = pv$('err');
  const btn = pv$('refresh');
  if (btn.disabled) return;
  btn.hidden = false; btn.disabled = true; btn.textContent = 'Fetching…';
  const bad = [];
  try {
    const answer = await PV.io.usage();
    for (const p of PV_PROVIDERS) {
      const v = answer?.[p];
      // An optional CLI the relay does not have, or a relay older than it: no card, no complaint.
      if (PV_OPTIONAL.includes(p) && (!v || v.absent)) continue;
      try {
        if (!v?.doc) bad.push(v?.error || `no ${p} data`);
        else if (plannerParse(v.doc).provider !== p) bad.push(`wrong ${p} data`);
        else pvAccept(v.doc);
      }
      catch (e) { bad.push(`${p}: ${e.message}`); }
    }
  } catch (e) {
    bad.push(`Could not fetch from the relay: ${e.message}`);
  }
  btn.disabled = false; btn.textContent = 'Refresh';
  err.textContent = bad.join('; ');
  if (bad.length) PV.showIntake = true;
  pvRender();
}

// Reached through the relay, which may run a switch. Opened as a file, there is nothing to run it.
const pvCanRun = () => PV.io.reachable();

async function pvRun(btn) {
  const [provider, account] = btn.dataset.run.split(':');
  const command = PV_CMD[provider].switch(account);
  const status = pv$('runMsg');
  btn.disabled = true;
  status.textContent = `running ${command}…`;
  try {
    const a = await PV.io.run(provider, account);
    status.textContent = a.ok ? `${command}: done` : `${command} failed: ${a.error}`;
    if (a.ok) await pvFetch();
  } catch (e) {
    status.textContent = `${command} failed: ${e.message}`;
  }
  btn.disabled = false;
}

// One ordered list of sections in Settings, each on or off, kept under key: the stored order with
// unknown ids dropped and new ones appended. Returns the live array the render reads.
function pvOrderList(list, key, names, defaults) {
  const rows = defaults.map(x => [...x]);
  try {
    const saved = JSON.parse(pvGet(key) || 'null');
    if (Array.isArray(saved)) {
      const known = saved.filter(x => Array.isArray(x) && x[0] in names).map(([id, on]) => [id, !!on]);
      rows.splice(0, rows.length, ...known, ...defaults.filter(([id]) => !known.some(k => k[0] === id)).map(x => [...x]));
    }
  } catch (e) { /* a stored copy that no longer parses is dropped */ }
  const draw = () => {
    list.innerHTML = rows.map(([id, on], i) => `<li><label><input type="checkbox" data-sec="${id}"${on ? ' checked' : ''}> ${names[id]}</label>`
      + `<button type="button" data-move="${id}" data-dir="-1" aria-label="Move ${names[id]} up"${i ? '' : ' disabled'}>↑</button>`
      + `<button type="button" data-move="${id}" data-dir="1" aria-label="Move ${names[id]} down"${i < rows.length - 1 ? '' : ' disabled'}>↓</button></li>`).join('');
  };
  const changed = () => { pvSet(key, JSON.stringify(rows)); draw(); pvRender(); };
  draw();
  list.addEventListener('change', e => {
    const row = rows.find(([id]) => id === e.target.dataset.sec);
    if (row) { row[1] = e.target.checked; changed(); list.querySelector(`[data-sec="${row[0]}"]`).focus(); }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-move]');
    if (!b) return;
    const i = rows.findIndex(([id]) => id === b.dataset.move), j = i + Number(b.dataset.dir);
    if (i < 0 || j < 0 || j >= rows.length) return;
    [rows[i], rows[j]] = [rows[j], rows[i]];
    changed();
    const again = list.querySelector(`[data-move="${b.dataset.move}"][data-dir="${b.dataset.dir}"]`);
    (again && !again.disabled ? again : list.querySelector(`[data-move="${b.dataset.move}"]:not([disabled])`))?.focus();
  });
  return rows;
}

// Draws the planner into root, once: planner.html's body, or the phone's tab. The listeners that
// must sit on the document act only while root is on screen.
function pvMount(root, io = PV_HTTP) {
  if (PV.root) return;
  PV.root = root;
  PV.io = io;
  root.classList.add('planner');
  root.insertAdjacentHTML('afterbegin', PV_MARKUP);
  for (const p of PV_PROVIDERS) {
    const raw = pvGet(PV_STORE[p]);
    if (raw) try { pvAccept(raw); } catch (e) { /* a stored copy that no longer parses is dropped */ }
  }
  for (const [id, [key, , ok]] of Object.entries(PV_SETTINGS)) {
    const input = pv$(id);
    const saved = parseFloat(pvGet(key));
    if (Number.isFinite(saved) && ok(saved)) input.value = saved;
    input.addEventListener('input', () => { pvSet(key, input.value); pvRender(); });
  }
  PV.sections = pvOrderList(pv$('sections'), PV_SECTIONS_KEY, PV_SECTION_NAMES, PV_SECTIONS_DEFAULT);
  PV.pageSections = pvOrderList(pv$('pageSections'), PV_PAGE_SECTIONS_KEY, PV_PAGE_SECTION_NAMES, PV_PAGE_SECTIONS_DEFAULT);
  try {
    const saved = JSON.parse(pvGet(PV_SORT_KEY) || 'null');
    if (saved && typeof saved === 'object') for (const k in PV.sorts) PV.sorts[k] = saved[k] === true;
  } catch (e) { /* a stored copy that no longer parses is dropped */ }
  // Settings: the gear opens them; each applies as it changes.
  const dlg = pv$('settings');
  pv$('gear').addEventListener('click', () => dlg.showModal());
  try {
    const saved = JSON.parse(pvGet(PV_HOURS_KEY) || 'null');
    if (saved && saved.mode === 'window') {
      pv$('hoursWindow').checked = true;
      for (const [id, k] of [['hoursFrom', 'from'], ['hoursTo', 'to'], ['jobs', 'jobs'], ['jobsAt', 'jobsAt']]) {
        if (saved[k] != null) pv$(id).value = saved[k];
      }
    }
  } catch (e) { /* a stored copy that no longer parses is dropped */ }
  const hoursChanged = () => {
    const spec = pvHoursSpec();
    for (const id of [...PV_HOURS_FIELDS, 'jobsSet']) pv$(id).disabled = spec.mode !== 'window';
    pv$('hoursSum').textContent = pvHoursText(spec);
    pvSet(PV_HOURS_KEY, JSON.stringify(spec));
  };
  hoursChanged();
  for (const id of ['hoursAll', 'hoursWindow', ...PV_HOURS_FIELDS]) {
    pv$(id).addEventListener('input', () => { hoursChanged(); pvRender(); });
  }
  for (const [id, [key, fallback]] of Object.entries(PV_TOGGLES)) {
    const box = pv$(id);
    const saved = pvGet(key);
    box.checked = saved == null ? fallback : saved === '1';
    box.addEventListener('change', () => { pvSet(key, box.checked ? '1' : '0'); pvRender(); });
  }
  // Tips: hover or focus shows one, a click pins it, a click anywhere else or Escape lets it go.
  const out = pv$('out');
  out.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]'); if (el) pvShowTip(el, false); });
  out.addEventListener('mouseout', e => { if (e.target.closest('[data-tip]')) pvHideTip(false); });
  out.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) pvShowTip(el, false); });
  out.addEventListener('focusout', () => pvHideTip(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && pvShown()) pvHideTip(true); });
  // Inside a chart the arrow keys move between its bars and marks, row by row; Home and End jump.
  out.addEventListener('keydown', e => {
    const el = e.target.closest('.tl-wrap [data-tip]');
    const step = {ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1, Home: -Infinity, End: Infinity}[e.key];
    if (!el || !step) return;
    e.preventDefault();
    const all = [...el.closest('.tl-wrap').querySelectorAll('[data-tip]')];
    const next = all[Math.max(0, Math.min(all.length - 1, all.indexOf(el) + step))];
    el.tabIndex = -1;
    next.tabIndex = 0;
    next.focus();
  });
  pv$('load').addEventListener('click', () => {
    const box = pv$('paste');
    if (pvLoad(box.value)) box.value = '';
  });
  pv$('files').addEventListener('change', async e => {
    for (const f of e.target.files) pvLoad(await f.text());
    e.target.value = '';
  });
  pv$('openFiles').addEventListener('click', () => pv$('files').click());
  document.addEventListener('dragover', e => { if (!pvShown()) return; e.preventDefault(); root.classList.add('dragging'); });
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) root.classList.remove('dragging'); });
  document.addEventListener('drop', async e => {
    if (!pvShown()) return;
    e.preventDefault();
    root.classList.remove('dragging');
    for (const f of e.dataTransfer.files) pvLoad(await f.text());
  });
  // A click outside the root lets a pinned tip go; inside, it is the page's own.
  document.addEventListener('click', e => { if (!root.contains(e.target)) pvHideTip(true); });
  root.addEventListener('click', e => {
    const tipped = e.target.closest('[data-tip]');
    if (tipped) pvShowTip(tipped, true);
    else if (!e.target.closest('#tip')) pvHideTip(true);
    const n = e.target.closest('[data-nav]');
    if (n && !n.disabled) {
      const {nav: key, dir} = n.dataset;
      PV.pages[key] = Math.max(0, PV.pages[key] + Number(dir));
      pvRender();
      const again = root.querySelector(`[data-nav="${key}"][data-dir="${dir}"]`);
      (again && !again.disabled ? again : root.querySelector(`[data-nav="${key}"]:not([disabled])`))?.focus({preventScroll: true});
    }
    const m = e.target.closest('[data-more]');
    if (m) {
      PV.more[m.dataset.more] = !PV.more[m.dataset.more];
      pvRender();
      root.querySelector(`[data-more="${m.dataset.more}"]`)?.focus({preventScroll: true});
    }
    const r = e.target.closest('[data-run]');
    if (r && !r.disabled) armButton(r, null, () => pvRun(r), r.dataset.armKey);
    const b = e.target.closest('[data-copy]');
    if (b) {
      navigator.clipboard?.writeText(b.dataset.copy).then(() => {
        const was = b.textContent; b.textContent = 'copied'; setTimeout(() => { b.textContent = was; }, 900);
      }, () => {});
    }
    if (e.target.id === 'again') { e.preventDefault(); PV.showIntake = true; pvRender(); pv$('paste').focus(); }
  });
  pv$('refresh').addEventListener('click', pvFetch);
  pv$('out').addEventListener('change', e => {
    const sort = e.target.dataset.sort;
    if (sort in PV.sorts) {
      PV.sorts[sort] = e.target.checked;
      pvSet(PV_SORT_KEY, JSON.stringify(PV.sorts));
      pvRender();  // and the redraw keeps the switch focused
      return;
    }
    const key = e.target.dataset.range;
    const hours = Number(e.target.value);
    if (!(key in PV.ranges) || !PV_RANGES[hours]) return;
    PV.ranges[key] = hours;
    PV.pages[key] = 0;
    pvRender();
    root.querySelector(`[data-range="${key}"]`).focus();
  });
  pvRender();
  pvFetch();
  setInterval(() => { if (pvShown()) pvRender(); }, 60e3);
}

  </script>
  <script>pvMount(document.body);</script>
</body>
