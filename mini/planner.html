<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1b26">
  <!-- Stamped by scripts/build.py, as every page's are. -->
  <meta name="app-version" content="0.6.0">
  <meta name="app-built" content="2026-11-21">
  <title>Usage Planner</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20rx='4'%20fill='%231a1b26'/%3E%3Crect%20x='2'%20y='9'%20width='3'%20height='4'%20rx='1'%20fill='%237aa2f7'/%3E%3Crect%20x='6.5'%20y='6'%20width='3'%20height='7'%20rx='1'%20fill='%239ece6a'/%3E%3Crect%20x='11'%20y='3'%20width='3'%20height='10'%20rx='1'%20fill='%23ff9e64'/%3E%3C/svg%3E">
  <!--
    The usage planner. It opens no socket. It reads what `cswap list --json` and
    `codex-auth list --json` print: from the relay's /api/planner-usage when the relay serves it,
    or pasted or dropped in. It keeps the last of each in this browser only. src/planner.js plans; src/planner_view.js draws.
  -->
  <style>
/* The usage planner's styles, for web/planner.html and the phone's Usage tab alike. Every rule is
   under .planner, the class pvMount puts on its root, so none of them reaches the phone's own
   markup. */

/* The other way, the phone's rules do reach into the tab: its reset of every element's margin and
   padding, its 13px fields, and bare .chip and .seg rules of its own (a pointer, bold, a border
   on every bar). These put back what the browser gives planner.html. First in the file and next
   to no specificity, so they beat the phone's rules by order and every .planner rule beats them. */
:where(#plannerView) :is(input, select, textarea, option, dialog) { margin: revert; padding: revert; font-size: revert; }
:where(#plannerView) :is(.chip, .seg) { all: revert; }

.planner {
  --bg: #f5f5f7; --panel: #ffffff; --line: #dcdde3; --fg: #24283b; --muted: #6b7089;
  color-scheme: light;
  --track: #e9eaf0; --idle: #ba334a; --warn: #986000; --ok: #258254; --accent: #3d59a1;
  --gap: #707783; --session-line: rgba(255, 255, 255, .85);
  --claude: #d9713a; --codex: #1a9e95; --opencode: #7c5cd6;
  /* Account colours: no green (kept for parallel bonus) and no red or yellow (kept for flags). */
  --a0: #4f78c4; --a1: #8564bd; --a2: #2595bc; --a3: #4f55a6; --a4: #b0479a; --a5: #5b6b80;
  --bonus: #a3dfb3; --burn: #13843a;
  --flag-red: #d62d2d; --flag-yellow: #c99a00;
  --weekend: rgba(0, 0, 0, .035);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .planner {
    color-scheme: dark;
    --bg: #1a1b26; --panel: #1f2335; --line: #2f334d; --fg: #c0caf5; --muted: #7a80a8;
    --track: #292e42; --accent: #7aa2f7; --claude: #ff9e64; --codex: #2ac3b4; --opencode: #bb9af7;
    --idle: #ff7a90; --warn: #e6b657; --ok: #70bd94; --gap: #929aaa; --muted: #a1a7c5;
    --a0: #7aa2ed; --a1: #b19ae4; --a2: #6ebcdd; --a3: #9299eb; --a4: #e08cc9; --a5: #9aa8bd;
    --bonus: #a6e9bb; --burn: #1fae52;
    --session-line: rgba(0, 0, 0, .8);
  --flag-red: #ff5c5c; --flag-yellow: #ffd23f;
    --weekend: rgba(255, 255, 255, .03);
  }
}
/* The phone's dark theme is the absence of its light one, whatever the system says; :where keeps
   this rule below the phone's surface mapping. */
:root[data-theme="dark"] .planner, :where(:root:not([data-theme="light"])) #plannerView .planner {
  color-scheme: dark;
  --bg: #1a1b26; --panel: #1f2335; --line: #2f334d; --fg: #c0caf5; --muted: #7a80a8;
  --track: #292e42; --accent: #7aa2f7; --claude: #ff9e64; --codex: #2ac3b4; --opencode: #bb9af7;
  --idle: #ff7a90; --warn: #e6b657; --ok: #70bd94; --gap: #929aaa; --muted: #a1a7c5;
  --a0: #7aa2ed; --a1: #b19ae4; --a2: #6ebcdd; --a3: #9299eb; --a4: #e08cc9; --a5: #9aa8bd;
  --bonus: #a6e9bb; --burn: #1fae52;
  --session-line: rgba(0, 0, 0, .8);
  --flag-red: #ff5c5c; --flag-yellow: #ffd23f;
  --weekend: rgba(255, 255, 255, .03);
}
/* The tab's back bar is the phone's two-row header with only its first row: one line, centred. */
#plannerView > .conv-view-head { display: flex; align-items: center; }
/* In the phone's Usage tab the surfaces are the app's own, so the tab reads as part of it. The
   planner's other colours keep their own light and dark values, chosen by the phone's theme. */
#plannerView { --pv-bg: var(--bg); --pv-panel: var(--surface); --pv-line: var(--border); --pv-fg: var(--text); --pv-accent: var(--blue); }
#plannerView .planner { --bg: var(--pv-bg); --panel: var(--pv-panel); --line: var(--pv-line); --fg: var(--pv-fg); --accent: var(--pv-accent); }
.planner, .planner * { box-sizing: border-box; }
.planner [hidden] { display: none !important; }
.planner a { color: var(--accent); }
.planner {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
.planner header {
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
.planner h1 { font-size: 16px; margin: 0; }
.planner h2 { font-size: 13px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.planner h3 { font-size: 15px; margin: 0; display: flex; gap: 8px; align-items: baseline; }
.planner main { padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; max-width: 1400px; margin: 0 auto; }
.planner .muted { color: var(--muted); }
.planner .small { font-size: 12px; }
.planner button, .planner select {
  font: inherit; font-size: 12px; color: var(--fg); background: var(--track);
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 36px; cursor: pointer;
}
.planner button:hover { border-color: var(--accent); }
.planner :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.planner input[type=time] { font: inherit; color: var(--fg); background: var(--track); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.planner input[type=number] { width: 56px; font: inherit; color: var(--fg); background: var(--track); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.planner .grow { flex: 1; }

.planner #intake { display: grid; gap: 8px; }
.planner #intake textarea {
  width: 100%; min-height: 72px; font: 12px ui-monospace, Menlo, monospace; color: var(--fg);
  background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 8px;
}
.planner.dragging #intake textarea { border-color: var(--accent); }
.planner .sources { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.planner .src { padding: 2px 8px; border-radius: 999px; background: var(--track); font-size: 12px; }
.planner .src.stale { color: var(--warn); }
.planner #err { color: var(--idle); font-size: 12px; overflow-wrap: anywhere; }
.planner #out { display: grid; gap: 16px; min-width: 0; }
.planner .chart-head { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.planner .chart-head h2 { margin: 0; }
.planner .chart-head label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }

.planner .providers { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
.planner .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
.planner .prov-claude h3 .dot { background: var(--claude); }
.planner .prov-codex h3 .dot { background: var(--codex); }
.planner .prov-opencode h3 .dot { background: var(--opencode); }
.planner .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.planner .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.planner .chips:has(+ .chips.resets) { margin-bottom: 0; }
.planner .chips.resets { margin-top: 6px; }
.planner .chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--track); }
.planner .chip.bad { background: color-mix(in srgb, var(--idle) 22%, transparent); }
.planner .chip.good { background: color-mix(in srgb, var(--ok) 22%, transparent); }
.planner .chip.warn { background: color-mix(in srgb, var(--warn) 25%, transparent); }

/* Accounts, soonest event first. */
.planner .acct { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
.planner .acct:first-of-type { border-top: 0; }
.planner .acct .who { display: flex; flex-direction: column; min-width: 0; }
.planner .acct .who b { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; overflow-wrap: anywhere; }
.planner .acct .who .email { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.planner .live { font-size: 10px; padding: 0 5px; border-radius: 4px; background: var(--accent); color: var(--panel); }
/* The 5h and 7d windows each in a card of their own, so the two read apart. */
.planner .meter { font-size: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
.planner .meter .lbl { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 6px; color: var(--muted); }
.planner .meter .lbl b { color: var(--fg); font-weight: 600; }
/* One row per reset credit under the two cards, on the cards' own columns: the burn under 5h,
   the expiry under 7d, so every burn lines up on the left and every expiry on the right. */
/* The cards and their credit rows in a grid of their own, so a tall name column beside them
   never opens a gap between the two. */
.planner .acct .use { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 12px; align-items: start; }
.planner .acct .credits { grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; font-size: 12px; color: var(--muted); }
.planner .acct .credits > span { padding: 1px 8px; border-top: 1px dashed var(--line); overflow-wrap: anywhere; }
.planner .acct .credits > span:nth-child(-n+2) { border-top: 0; }
.planner .bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin-top: 4px; }
.planner .bar i { display: block; height: 100%; background: var(--ok); }
.planner .bar i.mid { background: var(--warn); }
.planner .bar i.hi { background: var(--idle); }
.planner .acct .extra { margin-top: 4px; font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.planner .acct .extra > span { white-space: nowrap; }
.planner .lost { color: var(--idle); }
.planner .extra .thin { color: var(--warn); }
.planner .acct.off { opacity: .55; }

/* Timelines: rows of absolutely placed segments and marks over a shared time axis. */
.planner .tl-wrap { padding: 6px 12px 6px 0; container-type: inline-size; }
/* A month in a narrow chart: session dividers would stripe the bars, and a label per day overlap. */
@container (max-width: 900px) { .planner .tl.dense .seg { background-image: none; } }
@container (max-width: 700px) { .planner .tl.dense .axis span:not(.major) { display: none; } }
.planner .tl-row .name .pct { color: var(--muted); font-weight: 400; }
.planner .tl-row.now .name { font-weight: 700; }
.planner .tl-row.now .name::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 4px; border-radius: 50%; background: var(--accent); vertical-align: 1px; }
.planner .tl { position: relative; --label: 112px; }
.planner .tl-row { display: grid; grid-template-columns: var(--label) 1fr; align-items: center; height: 26px; }
.planner .tl-row .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.planner .tl-row.head .name { font-weight: 600; }
.planner .lane { position: relative; height: 18px; background: var(--track); border-radius: 4px; }
.planner .lane.thin { height: 8px; }
.planner .seg { position: absolute; top: 0; bottom: 0; border-radius: 3px; min-width: 1px;
  background-image: repeating-linear-gradient(to right, transparent 0, transparent calc(var(--session) - 1px), var(--session-line) calc(var(--session) - 1px), var(--session-line) var(--session)); }
.planner .seg.idle { background: repeating-linear-gradient(135deg, var(--gap) 0 4px, transparent 4px 8px); }
/* No box behind a mark: the glyph alone, with a 1px halo so it holds its edge over a bar. */
.planner .mark { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 13px; line-height: 1; cursor: pointer; background: none; font-variant-emoji: text; filter: drop-shadow(0 0 1px var(--panel)); }
.planner .mark.reset { color: var(--flag-red); font-size: 14px; font-weight: 700; }
.planner .mark.credit { color: var(--flag-yellow); font-size: 18px; }
/* A burn is a deep green star, outlined so it reads on the light green bonus bar it starts. */
.planner .mark.burn { color: var(--burn); font-size: 17px; filter: drop-shadow(0 0 1px var(--panel)) drop-shadow(0 0 1px var(--panel)); }
.planner .mark.lapse { color: var(--muted); }
.planner .axis { position: relative; height: 18px; margin: 0 0 2px var(--label); font-size: 10px; color: var(--muted); }
.planner .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.planner .grid { position: absolute; top: 0; bottom: 0; left: var(--label); right: 0; pointer-events: none; }
.planner .grid i { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); opacity: .6; }
.planner .grid i.we { border-left: 0; background: var(--weekend); }
.planner .grid .now { border-left: 2px solid var(--fg); opacity: 1; z-index: 2; }
.planner .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin: 10px 0; }
.planner .gap-key { color: var(--gap); } .planner .reset-key { color: var(--flag-red); }
.planner .credit-key { color: var(--flag-yellow); } .planner .burn-key { color: var(--burn); } .planner .bonus-key { color: var(--bonus); }
.planner .chip.bonus { background: color-mix(in srgb, var(--bonus) 22%, transparent); }
.planner .tl-row.sub { height: 14px; } .planner .tl-row.sub .name { font-size: 10px; color: var(--muted); padding-left: 10px; }
/* A provider's main line and parallel lines, boxed apart from its account rows. The box is an
   inset shadow, not a border, so the lanes keep the axis's x positions. */
/* Read as a header: the provider's colour as a tinted band with a bar down its left, lifted
   off the account rows, its name set like the section headings. */
.planner .tl-group { --hue: var(--accent); position: relative; padding: 4px 0; margin: 6px 0; border-radius: 6px;
  background: color-mix(in srgb, var(--hue) 16%, transparent);
  box-shadow: inset 3px 0 0 var(--hue), inset 0 0 0 1px color-mix(in srgb, var(--hue) 35%, transparent), 0 2px 6px rgb(0 0 0 / .18); }
.planner .tl-group.prov-claude { --hue: var(--claude); } .planner .tl-group.prov-codex { --hue: var(--codex); } .planner .tl-group.prov-opencode { --hue: var(--opencode); }
.planner .tl-group .tl-row.head .name { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.planner .tl-group .tl-row { height: 18px; } .planner .tl-group .tl-row.sub { height: 10px; }
.planner .tl-row.sub .lane { background: none; }
.planner .tl-group .name { padding-left: 8px; } .planner .tl-group .tl-row.sub .name { padding-left: 16px; }

.planner .seg { cursor: pointer; }
/* The tip bubble: one per page, placed over whatever was hovered or clicked. */
.planner #tip { position: fixed; z-index: 10; max-width: min(340px, calc(100vw - 16px)); padding: 8px 10px; border-radius: 8px;
  background: var(--panel); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0, 0, 0, .25); font-size: 12px; pointer-events: none; }
.planner #tip[data-pinned="1"] { pointer-events: auto; border-color: var(--accent); }
.planner #tip b { display: block; margin-bottom: 4px; }
.planner #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0; }
.planner #tip dt { color: var(--muted); } .planner #tip dd { margin: 0; }
/* On/off switches for the plan's two modes. */
/* Settings: a native dialog, applied as it changes. */
.planner dialog#settings { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--fg);
  padding: 16px; width: min(420px, calc(100vw - 32px)); box-shadow: 0 12px 40px rgba(0, 0, 0, .25); }
.planner dialog#settings::backdrop { background: rgba(0, 0, 0, .35); }
.planner dialog#settings fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 12px; padding: 8px 12px 10px;
  display: grid; gap: 8px; font-size: 13px; }
.planner dialog#settings fieldset.inner { border: 0; padding: 0 0 0 22px; margin: 0; }
.planner dialog#settings fieldset:disabled { opacity: .5; }
.planner dialog#settings legend { font-size: 12px; color: var(--muted); padding: 0 4px; }
.planner dialog#settings p { margin: 0; }
.planner ol.sections { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.planner ol.sections li { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; }
.planner ol.sections button { padding: 2px 10px; }
.planner .card > .sec { margin-top: 14px; }
.planner .card > .sec > h2:first-child { margin-top: 0; }
.planner .sec-steps > ol.steps { margin-top: 0; }
.planner dialog#settings .actions { display: flex; justify-content: flex-end; }
/* Simple view: what to do now. Charts, comparisons and the finer print are the detailed view's. */
.planner.simple .detail { display: none; }
.planner.simple ol.steps li:nth-child(n+3), .planner.simple ol.steps li.more { display: none; }
.planner.simple .acct .email { display: none; }
.planner.simple .acct .credits > span:nth-child(n+3) { display: none; }
.planner #gear { display: inline-flex; gap: 6px; align-items: center; }
.planner #gear svg { flex: none; }
.planner .seg.off { background: none; }
.planner ol.steps li.off { color: var(--muted); }
.planner .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
.planner .switch input { appearance: none; width: 32px; height: 18px; margin: 0; border-radius: 9px; background: var(--track); border: 1px solid var(--line); position: relative; cursor: pointer; transition: background .15s; }
.planner .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.planner .switch input:checked { background: var(--accent); border-color: var(--accent); }
.planner .switch input:checked::after { transform: translateX(14px); background: var(--panel); }
.planner .switch input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .planner .switch input, .planner .switch input::after { transition: none; } }
.planner .nav { display: inline-flex; gap: 6px; align-items: center; }
.planner .nav button { min-width: 32px; font-size: 15px; line-height: 1; }
.planner .nav .span { font: 12px ui-monospace, Menlo, monospace; white-space: pre; text-align: center; }
.planner .nav button:disabled, .planner ol.sections button:disabled { opacity: .4; cursor: default; }

/* A switch run from the page: the first press arms it and the fill drains over arm.js's 2.5s;
   the second press inside that runs it. The app's own armed look, in this page's tokens. */
.planner .cmds { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.planner .arm-btn[data-armed="1"] {
  color: var(--panel); border-color: transparent;
  background: linear-gradient(to right, var(--claude) 50%, var(--track) 50%) right / 200% 100%;
  animation: arm-drain 2.5s linear forwards;
}
@keyframes arm-drain { from { background-position: left; } to { background-position: right; } }
@media (prefers-reduced-motion: reduce) { .planner .arm-btn[data-armed="1"] { background: var(--claude); animation: none; } }

/* The next 24h as steps. */
/* One grid for the list, each row a subgrid: the time column is as wide as the widest time, so
   a time never wraps and every row's text starts at the same edge. */
.planner ol.steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; gap: 4px; max-height: 340px; overflow-y: auto; }
.planner ol.steps li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; gap: 8px; align-items: center; font-size: 13px; padding: 6px; border-radius: 6px; overflow-wrap: anywhere; }
.planner ol.steps li.burn { background: color-mix(in srgb, var(--idle) 12%, transparent); }
.planner ol.steps li.idle { background: color-mix(in srgb, var(--idle) 6%, transparent); }
/* The modes table: every combination of the two switches, the one in use marked. */
.planner .modes .table-wrap { overflow-x: auto; }
.planner .modes table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.planner .modes th, .planner .modes td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
.planner .modes thead th { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; vertical-align: bottom; white-space: normal; }
.planner .modes th[scope="row"], .planner .modes th[scope="rowgroup"], .planner .modes thead th:nth-child(-n+2) { text-align: left; }
.planner .modes th[scope="rowgroup"] { vertical-align: top; font-weight: 600; }

  <script>
    // The two-tap arm, on any button a render drew.
    //
    // Its own file because it is not a phone control: the arm is the confirmation step in front of
    // everything destructive the app can do, and the desktop page reaches it through arbitration's
    // Re-brief and End session — two buttons in a dialog whose module both pages load. It was the
    // head of controls.js, which is a phone's pane header and nothing this page has.
    //
    // `armFire` stayed there and serves the header's CLS and QUIT: it is keyed by element id
    // against a table of labels, and these buttons are rebuilt from innerHTML with no id worth
    // having. So this arm hangs off the element, and only one is ever armed — a second arm
    // disarms the first, because two buttons both claiming the next tap is not a promise.
    //
    // 2.5s rather than the header's 1.5s. That window is short because QUIT sits under the thumb
    // for as long as a pane is open; these are reached by opening a panel and aiming, and a
    // deadline that expires while you are still moving teaches people to double-tap blind.
    const ARM_MS = 2500;
    let armedEl = null, armedKey = '', armedTimer = 0;

    // `key` is for a control whose enclosing card is redrawn by the poll. Its element changes,
    // but its action does not; matching that action lets the second tap reach the same arm.
    // The button keeps its words: the drain behind them is the whole signal. A `label` is a note
    // for what the button cannot say in its own words — "Every tab on this profile closes" — and
    // shows as a toast on the first tap, never in place of the button's text.
    function armButton(btn, label, run, key) {
      if ((key && armedKey === key) || (!key && armedEl === btn)) { disarmButton(); run(); return; }
      disarmButton();
      armedEl = btn;
      armedKey = key || '';
      btn.dataset.armed = '1';
      // The drain is drawn off `.arm-btn`, so a button whose markup never asked for it gets it for
      // as long as it is armed — every armed button looks armed, whichever render drew it.
      if (!btn.classList.contains('arm-btn')) { btn.classList.add('arm-btn'); btn.dataset.armClass = '1'; }
      if (label && typeof showToast === 'function') showToast(label);
      // Disarms itself rather than waiting to be pressed again — the same reason the header's does.
      armedTimer = setTimeout(disarmButton, ARM_MS);
    }

    function disarmButton() {
      clearTimeout(armedTimer);
      const btn = armedEl;
      const key = armedKey;
      armedEl = null; armedKey = '';
      // The element that was armed, and — for a keyed arm — whatever is standing in its place now.
      // A poll redraw replaces the node between the two taps, so by the time the arm expires the
      // one on screen is not the one this holds, and clearing only `armedEl` leaves a detached
      // node tidied and a live button still draining with nothing behind it.
      // Read off the dataset rather than matched in a selector: the arm key is whatever the
      // caller had to name — a member's agent id, a conversation id, a label someone typed — and
      // a selector built out of one throws on the character it did not expect, which loses the
      // second tap rather than the styling.
      const live = key && typeof document !== 'undefined' && document.querySelectorAll
        ? Array.from(document.querySelectorAll('[data-arm-key]'))
          .find(el => el.dataset.armKey === key) : null;
      for (const el of new Set([btn, live])) {
        if (!el || !el.dataset || !el.dataset.armed) continue;
        delete el.dataset.armed;
        if (el.dataset.armClass) { el.classList.remove('arm-btn'); delete el.dataset.armClass; }
      }
    }

    function armButtonArmed(key) { return !!key && armedKey === key; }

    // Anywhere else, and the arm is off: a tap that lands somewhere else is a tap that was not
    // the second half of this pair.
    document.addEventListener('click', (e) => {
      const keyed = e.target.closest && e.target.closest('[data-arm-key]');
      if (e.target !== armedEl && (!keyed || keyed.dataset.armKey !== armedKey)) disarmButton();
    }, true);

  </script>
  <script>
// The usage planner's logic: reads `cswap list --json`, `codex-auth list --json` and
// `opencode-go-usage list --json`, and plans
// which account to run, and when to burn a reset credit, over the coming month.
//
// Pure: no DOM, no clock. planner_view.js draws what this returns, and tests/test_planner.js runs
// it in a vm. The two providers are planned apart, one account in use at a time, all 24 hours
// unless hours of use say otherwise.
//
// The model, per account:
//   - One session is WEEK_PER_FIVE % of the 7d window, spent in fillH hours of use (5 by
//     default: steady use, which fills the 5h window just as it resets). A window with no reset
//     time starts on first use.
//   - At a 7d reset, whatever is left unused is lost. So run first the account whose week ends
//     soonest (earliest deadline first): that is what wastes the least.
//   - A reset credit clears both windows. On Claude the week keeps its end date, so a credit is
//     worth only the hours left before it; on Codex the week restarts from the reset.

const PLAN_H = 3600e3;
const PLAN_FIVE = 5 * PLAN_H;
const PLAN_WEEK = 7 * 24 * PLAN_H;
const WEEK_PER_FIVE = 12;
// ponytail: a credit is burned for a gap only when it buys a full 5h block; a planner that looks
// ahead for the best moment would beat this, add one if burns land badly in practice.
const BURN_MIN_H = 5;

function plannerMs(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v < 1e12 ? v * 1000 : v;
  const t = Date.parse(v);
  return Number.isNaN(t) ? null : t;
}

// Either tool's document, recognised by its shape. Returns {provider, fetchedAt, accounts}.
function plannerParse(doc) {
  if (typeof doc === 'string') doc = JSON.parse(doc);
  if (!doc || !Array.isArray(doc.accounts)) throw new Error('no accounts list');
  if (doc.schema === 'opencode-go-usage') return parseOpencode(doc);
  if ('activeAccountNumber' in doc || doc.schemaVersion != null) return parseCswap(doc);
  if (doc.command === 'list' || doc.schema_version != null) return parseCodexAuth(doc);
  throw new Error('not cswap, codex-auth or opencode-go-usage list --json output');
}

function parseCswap(doc) {
  let fetched = null;
  const accounts = doc.accounts.map(a => {
    const u = a.usage || {};
    const f = u.fiveHour, w = u.sevenDay;
    fetched = Math.max(fetched || 0, plannerMs(a.usageFetchedAt) || 0) || fetched;
    const credits = [];
    for (const g of u.resetGrants || []) {
      if (g.paused) continue;
      for (let i = 0; i < (g.resetsLeft || 0); i++) {
        credits.push({id: `${g.id}#${i}`, label: g.label || 'Full reset',
                      startsAt: plannerMs(g.startsAt), expiresAt: plannerMs(g.endsAt),
                      needsLimit: !!g.useRequiresLimit});
      }
    }
    return {
      id: a.number, name: a.alias || `#${a.number}`, email: a.email || '', active: !!a.active,
      ok: a.usageStatus === 'ok' && !!w && !a.disabled,
      five: f ? {pct: f.pct || 0, resetsAt: plannerMs(f.resetsAt)} : {pct: 0, resetsAt: null},
      week: w ? {pct: w.pct || 0, resetsAt: plannerMs(w.resetsAt)} : null,
      credits: sortCredits(credits), keepsWeek: true,
    };
  });
  return {provider: 'claude', fetchedAt: fetched, accounts};
}

function parseCodexAuth(doc) {
  let fetched = null;
  const accounts = doc.accounts.map(a => {
    const u = a.usage || {};
    // primary/secondary are not 5h/7d by position: a plan with no 5h limit sends the week as
    // primary. The window's length says which it is.
    const wins = [u.primary, u.secondary].filter(Boolean);
    const pick = mins => {
      const x = wins.find(v => v.window_minutes === mins);
      return x ? {pct: x.used_percent || 0, resetsAt: plannerMs(x.resets_at)} : null;
    };
    fetched = Math.max(fetched || 0, plannerMs(u.updated_at) || 0) || fetched;
    const credits = (u.reset_credit || []).filter(c => c.status === 'available').map(c => ({
      id: c.id, label: c.title || 'Full reset', startsAt: null,
      expiresAt: plannerMs(c.expires_at), needsLimit: false}));
    const week = pick(10080);
    return {
      id: a.number, name: a.alias || a.account_name || `#${a.number}`, email: a.email || '',
      active: !!a.active, ok: !!week,
      five: pick(300), week, credits: sortCredits(credits), keepsWeek: false,
    };
  });
  return {provider: 'codex', fetchedAt: fetched, accounts};
}

// The OpenCode Go plan's limits are dollars: the 5h window is 20% of the month's allowance and the
// week 50%, so one session is 40% of the week. The document carries it, over the Settings value.
const OPENCODE_WEEK_PER_FIVE = 40;

function parseOpencode(doc) {
  const accounts = doc.accounts.map(a => {
    const u = a.usage || {};
    const win = w => w && Number.isFinite(w.percent)
      ? {pct: w.status === 'rate-limited' ? 100 : w.percent, resetsAt: plannerMs(w.resetsAt)} : null;
    const five = win(u.rolling), month = win(u.monthly);
    let week = win(u.weekly);
    // An unused 5h window has not started: the time it gives is only now + 5h.
    if (five && !five.pct) five.resetsAt = null;
    // ponytail: the month counts only once used up, when it stops the week too. A month nearly
    // spent also caps the week before then; plan that when it bites.
    if (week && month && month.pct >= 100) week = {...week, pct: 100};
    return {id: a.number, name: a.name || `#${a.number}`, email: '', active: !!a.active, ok: !!week,
            five: five || {pct: 0, resetsAt: null}, week, month, credits: [], keepsWeek: false};
  });
  return {provider: 'opencode', fetchedAt: plannerMs(doc.fetchedAt), weekPerFive: OPENCODE_WEEK_PER_FIVE, accounts};
}

function sortCredits(list) {
  return list.sort((a, b) => (a.expiresAt ?? Infinity) - (b.expiresAt ?? Infinity));
}

// What burning a credit now gives back, in hours of continuous work.
function creditGainH(s, t, r7) {
  const back = s.p7 / r7;
  if (!s.keepsWeek || s.t7 == null) return back;
  return Math.max(0, Math.min(back, (s.t7 - t) / PLAN_H));
}

// Hours of use: when work runs, as daily windows in local minutes [from, to), a `to` past 1440
// running over midnight. null is all day. spec: {mode: 'all'} or {mode: 'window', from: '09:00',
// to: '01:00', jobs: n, jobsAt: '02:00'}: the person's hours, plus n timed jobs of one session
// each (fillH hours of use) back to back from jobsAt.
function plannerHoursOfUse(spec, fillH = 5) {
  if (!spec || spec.mode !== 'window') return null;
  const min = v => { const [h, m] = String(v || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
  const from = min(spec.from), to = min(spec.to);
  const wins = [[from, to > from ? to : to + 1440]];
  const jobs = Math.max(0, Math.floor(spec.jobs || 0));
  if (jobs) { const at = min(spec.jobsAt); wins.push([at, at + jobs * fillH * 60]); }
  return wins;
}

// The windows as times, for the local days around `t`: yesterday's may run into today.
function plannerSpans(t, wins) {
  const spans = [];
  for (let k = -1; k <= 1; k++) {
    for (const [a, b] of wins) {
      const s = new Date(t); s.setDate(s.getDate() + k); s.setHours(0, a, 0, 0);
      const e = new Date(t); e.setDate(e.getDate() + k); e.setHours(0, b, 0, 0);
      spans.push([s.getTime(), e.getTime()]);
    }
  }
  return spans;
}
const plannerOn = (t, wins) => !wins || plannerSpans(t, wins).some(([s, e]) => s <= t && t < e);
// The next time at which work may start or stop.
function plannerNextEdge(t, wins) {
  if (!wins) return Infinity;
  return plannerSpans(t, wins).flat().filter(x => x > t).reduce((m, x) => Math.min(m, x), Infinity);
}
// Hours of use between two times.
function plannerOnHours(from, to, wins) {
  if (!wins) return Math.max(0, to - from) / PLAN_H;
  let h = 0;
  for (let t = from; t < to; ) {
    const n = Math.min(to, plannerNextEdge(t, wins));
    if (plannerOn(t, wins)) h += n - t;
    t = n;
  }
  return h / PLAN_H;
}

// Runs the accounts forward from `now`, one in use at a time. Returns the plan:
//   segments: [{start, end, id, off}]  id null for a gap with nothing usable, or, with off set,
//             outside the hours of use (opts.windows, from plannerHoursOfUse)
//   parallel: [{start, end, id, lane}]  bonus use alongside the main line (opts.parallel only)
//   burns:    [{t, id, credit, gainH, why}]   why 'gap', 'full' or 'expiring'
//   resets:   [{t, id, lostPct}]  natural 7d resets, and the headroom each one throws away
//   expired:  [{t, id, credit}]   credits that lapsed unused
//   bonusH:   hours of parallel use
//   offH:     hours outside the hours of use
//
// opts.parallel: spend reset credits for their full value rather than only to fill a gap. A
// credit is burned the moment its account's week is used up with time enough left to use all of
// it again; that account then runs as a bonus beside the main line (lane 1, 2, …) until it runs
// dry or its week resets. The main line takes a bonus account only when nothing else is usable.
//
// opts.rotate: an account need not run dry before the next. At every session boundary (fillH
// hours on one account) the main line re-picks by least slack — hours to its week end less the
// hours of use it still holds — so the accounts take turns a session at a time instead of in
// one long run each.
// ponytail: off hours stop use but not the clock, while a credit's worth is still counted in
// continuous hours; with short hours of use a burn may give back less than it says.
// ponytail: the 'full' rule waits for an account to run dry, so a Claude credit whose account
// never runs dry early in a week still lapses into a last-chance burn; burning partway through a
// week would need lookahead.
function plannerSimulate(accounts, now, opts = {}) {
  const hours = opts.hours ?? 24 * 30;
  const dt = (opts.stepMin ?? 15) * 60e3;
  // Fill time: the hours of use one session's allowance takes. Under 5, the 5h window fills
  // before it resets and the pick below moves on to the next account.
  const fillH = opts.fillH ?? 5;
  const r5 = 100 / fillH;
  const r7 = (opts.weekPerFive ?? WEEK_PER_FIVE) / fillH;
  const end = now + hours * PLAN_H;
  const wins = opts.windows || null;
  const st = accounts.filter(a => a.ok).map(a => ({
    id: a.id, keepsWeek: a.keepsWeek, hasFive: !!a.five,
    p5: a.five ? a.five.pct : 0, t5: a.five ? a.five.resetsAt : null,
    p7: a.week.pct, t7: a.week.resetsAt,
    credits: a.credits.map(c => ({...c})),
  }));
  const parallel = !!opts.parallel;
  const rotate = !!opts.rotate;
  let runH = 0;  // hours on `cur` since this session on it began, for rotate
  const out = {segments: [], parallel: [], burns: [], resets: [], expired: [], idleH: 0, bonusH: 0, offH: 0, start: now, end};
  let cur = (accounts.find(a => a.active && a.ok) || {}).id ?? null;
  const usable = s => (!s.hasFive || s.p5 < 100 - 1e-6) && s.p7 < 100 - 1e-6;
  const burn = (s, c, t, why) => {
    s.credits.splice(s.credits.indexOf(c), 1);
    out.burns.push({t, id: s.id, credit: c, gainH: creditGainH(s, t, r7), why});
    s.p5 = 0; s.t5 = null; s.p7 = 0;
    if (!s.keepsWeek) s.t7 = null;
    // In parallel mode every burn but a gap's runs beside the main line, in the lowest free lane.
    if (parallel && why !== 'gap' && !s.lane) {
      const taken = new Set(st.map(x => x.lane).filter(Boolean));
      s.lane = 1;
      while (taken.has(s.lane)) s.lane++;
    }
  };
  // Consumes `h` hours of use on one account.
  const use = (s, t, h) => {
    if (s.hasFive) {
      if (s.t5 == null) s.t5 = t + PLAN_FIVE;
      s.p5 = Math.min(100, s.p5 + r5 * h);
    }
    if (s.t7 == null) s.t7 = t + PLAN_WEEK;
    s.p7 = Math.min(100, s.p7 + r7 * h);
  };
  const runsDry = (s, t) => Math.min(t + (100 - s.p7) / r7 * PLAN_H,
    s.hasFive ? t + (100 - s.p5) / r5 * PLAN_H : Infinity);
  const ready = (c, s, t) => (c.startsAt == null || c.startsAt <= t) && (!c.needsLimit || !usable(s));

  for (let t = now; t < end; ) {
    for (const s of st) {
      if (s.t5 != null && t >= s.t5) { s.p5 = 0; s.t5 = null; }
      if (s.t7 != null && t >= s.t7) {
        if (s.t7 >= now) out.resets.push({t: s.t7, id: s.id, lostPct: Math.max(0, 100 - s.p7)});
        s.p7 = 0; s.t7 = null;
        s.lane = 0;  // a fresh week is the main line's again
      }
      while (s.credits.length && s.credits[0].expiresAt != null && s.credits[0].expiresAt <= t) {
        out.expired.push({t: s.credits[0].expiresAt, id: s.id, credit: s.credits.shift()});
      }
      // Last chance: a credit lapsing before the next step is burned if it gives anything back.
      const c = s.credits.find(c => ready(c, s, t));
      if (c && c.expiresAt != null && c.expiresAt <= Math.min(end, t + dt)
          && creditGainH(s, t, r7) >= 1) burn(s, c, t, 'expiring');
      // Full value: the week is used up and there is time left to use every hour it gives back.
      if (parallel && s.p7 >= 100 - 1e-6) {
        const full = s.credits.find(c => ready(c, s, t));
        if (full && creditGainH(s, t, r7) >= s.p7 / r7 - 1e-6) burn(s, full, t, 'full');
      }
      if (s.lane && !usable(s) && s.p7 >= 100 - 1e-6) s.lane = 0;
    }

    // Outside the hours of use nothing runs, on the main line or beside it, until they open.
    if (!plannerOn(t, wins)) {
      let next = Math.min(end, plannerNextEdge(t, wins));
      for (const s of st) {
        for (const at of [s.t5, s.t7, ...s.credits.flatMap(c => [c.startsAt, c.expiresAt])]) {
          if (at != null && at > t) next = Math.min(next, at);
        }
      }
      const last = out.segments[out.segments.length - 1];
      if (last && last.off) last.end = next;
      else out.segments.push({start: t, end: next, id: null, off: true});
      out.offH += (next - t) / PLAN_H;
      t = next;
      continue;
    }

    const order = (a, b) =>
      (a.t7 ?? Infinity) - (b.t7 ?? Infinity) || (b.id === cur) - (a.id === cur) || a.id - b.id;
    const slack = s => ((s.t7 ?? Infinity) - t) / PLAN_H - (100 - s.p7) / r7;
    const byOrder = rotate ? (a, b) => slack(a) - slack(b) || a.id - b.id : order;
    const keep = rotate && runH < fillH - 1e-6 && st.find(s => s.id === cur && usable(s) && !s.lane);
    let pick = keep || st.filter(s => usable(s) && !s.lane).sort(byOrder)[0]
      || st.filter(usable).sort(byOrder)[0];
    if (pick) {
      pick.lane = 0;
      if (pick.id !== cur || runH >= fillH - 1e-6) runH = 0;
    }
    if (!pick) {
      const best = st.map(s => ({s, c: s.credits.find(c => ready(c, s, t)), gain: creditGainH(s, t, r7)}))
        .filter(x => x.c)
        .sort((a, b) => b.gain - a.gain || (a.c.expiresAt ?? Infinity) - (b.c.expiresAt ?? Infinity))[0];
      if (best && best.gain >= BURN_MIN_H) {
        burn(best.s, best.c, t, 'gap'); pick = best.s; runH = 0;
      }
    }

    // Stop at an allowance or event, even when it falls between the sampling steps.
    let next = Math.min(end, t + dt, plannerNextEdge(t, wins));
    for (const s of st) {
      for (const at of [s.t5, s.t7, ...s.credits.flatMap(c => [c.startsAt, c.expiresAt])]) {
        if (at != null && at > t) next = Math.min(next, at);
      }
    }
    if (pick) next = Math.min(next, runsDry(pick, t), rotate ? t + (fillH - runH) * PLAN_H : Infinity);
    const side = st.filter(s => s.lane && usable(s));
    for (const s of side) next = Math.min(next, runsDry(s, t));
    const usedH = (next - t) / PLAN_H;
    for (const s of side) {
      const prev = out.parallel.findLast(g => g.id === s.id && g.lane === s.lane);
      if (prev && prev.end === t) prev.end = next;
      else out.parallel.push({start: t, end: next, id: s.id, lane: s.lane});
      out.bonusH += usedH;
      use(s, t, usedH);
    }
    const id = pick ? pick.id : null;
    const last = out.segments[out.segments.length - 1];
    if (last && last.id === id && !last.off) last.end = next;
    else out.segments.push({start: t, end: next, id});
    if (!pick) { out.idleH += usedH; t = next; continue; }
    cur = id;
    runH += usedH;
    use(pick, t, usedH);
    t = next;
  }
  return out;
}

// Sessions that can still be skipped before weekly allowance goes unused, one account in use at a
// time. A session is one 5h window's allowance, weekPerFive % of the week. Closed form: the
// accounts in the order the plan runs them (earliest week end first), and at each one's reset,
// the hours left over once everything due by then has been used. Accounts whose week has not
// started are left out, since their first use sets the deadline; reset credits are left out too,
// since an unused one is already reported as spare.
// Returns {room, accounts: [{id, room, left, deadline}]}; room is Infinity with no account at risk.
// With hours of use, every hour counted is an hour of use.
// ponytail: the 5h cap counts whole windows in hours of use, not where each window falls.
function plannerRoom(accounts, now, opts = {}) {
  const S = opts.weekPerFive ?? WEEK_PER_FIVE;
  const fillH = opts.fillH ?? 5;
  const wins = opts.windows || null;
  const due = accounts.filter(a => a.ok && a.week && a.week.pct < 100 && a.week.resetsAt != null && a.week.resetsAt > now)
    .sort((a, b) => a.week.resetsAt - b.week.resetsAt);
  let need = 0;
  const rows = due.map(a => {
    const left = (100 - a.week.pct) / S;
    const hours = plannerOnHours(now, a.week.resetsAt, wins);
    need += left * fillH;
    const edf = (hours - need) / fillH;
    let cap = Infinity;
    if (a.five) {
      const wait = Math.min(hours, plannerOnHours(now, a.five.resetsAt ?? now, wins));
      const current = wait ? Math.min((100 - a.five.pct) / 100, wait / fillH) : 0;
      const after = hours - wait;
      cap = current + Math.floor(after / 5) + Math.min(1, (after % 5) / fillH) - left;
    }
    return {id: a.id, room: Math.min(edf, cap), left, deadline: a.week.resetsAt};
  });
  return {room: rows.reduce((m, r) => Math.min(m, r.room), Infinity), accounts: rows};
}

// The plan's first `hours` as steps a person follows: switches and burns, in time order.
function plannerSteps(plan, hours = 24) {
  const until = plan.start + hours * PLAN_H;
  const steps = [];
  for (const g of plan.segments) {
    if (g.start >= until) break;
    steps.push(g.off ? {t: g.start, kind: 'off', until: Math.min(g.end, until)}
      : g.id == null ? {t: g.start, kind: 'idle', until: Math.min(g.end, until)}
      : {t: g.start, kind: 'use', id: g.id, until: Math.min(g.end, until)});
  }
  for (const g of plan.parallel || []) {
    if (g.start < until) steps.push({t: g.start, kind: 'parallel', id: g.id, lane: g.lane, until: Math.min(g.end, until)});
  }
  for (const b of plan.burns) if (b.t < until) steps.push({t: b.t, kind: 'burn', id: b.id, gainH: b.gainH, why: b.why});
  // A burn and the use it opens share a time; the burn reads first.
  return steps.sort((a, b) => a.t - b.t || (b.kind === 'burn') - (a.kind === 'burn'));
}

// A plan in numbers, to set modes side by side: sessions of use (main line and parallel), hours
// with nothing usable (off hours are not a gap), credits burned and lapsed, sessions left unused at 7d resets, and how many
// times the main line changes account (a gap between two runs on one account is not a switch).
function plannerSummary(plan, opts = {}) {
  const fillH = opts.fillH ?? 5;
  let mainH = 0, gapH = 0, switches = 0, last = null;
  for (const g of plan.segments) {
    const h = (g.end - g.start) / PLAN_H;
    if (g.off) continue;
    if (g.id == null) { gapH += h; continue; }
    mainH += h;
    if (last != null && g.id !== last) switches++;
    last = g.id;
  }
  return {sessions: (mainH + plan.bonusH) / fillH, bonusSessions: plan.bonusH / fillH, gapH, switches,
          burns: plan.burns.length, lapsed: plan.expired.length,
          lostSessions: plan.resets.reduce((n, r) => n + r.lostPct, 0) / (opts.weekPerFive ?? WEEK_PER_FIVE)};
}
